<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="Devixo Solutions designs and builds websites, apps and brands for growing businesses.">
    <link rel="icon" href="assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script>
        try { 
            let t = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
            document.documentElement.dataset.theme = t; 
            } catch (e) 
            { }
    </script>
    <title>Contact | Apex Solutions</title>
</head>

<body>
    <!-- Navbar Section -->
    <header>
        <div class="wrap navbar"><a class="logo" href="index.html">APEX<b>.</b></a>
            <nav id="nav" aria-label="Main">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="portfolio.html">Portfolio</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
            <div class="tools">
                <button class="sm-btn" id="theme" aria-label="Toggle dark mode"></button>
                <button class="sm-btn" id="menu" aria-label="Menu" aria-expanded="false" aria-controls="nav">☰</button>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <main>
        <section class="wrap">
           <div class="work">
                <h1 style="margin-top: 10px;">Tell us about your project</h1>
                <p>Email <a href="mailto:au491021@gmail.com">au491021@gmail.com</a> or use the form below.</p>
           </div>
           
            <form id="contact" novalidate>
                <label>Name: <input name="name" autocomplete="name"><span class="err" role="alert"></span></label>
                <label>Email: <input name="email" type="email" autocomplete="email"><span class="err" role="alert"></span></label>
                <label>Message: <textarea name="message" rows="5"></textarea><span class="err" role="alert"></span></label>
                <button class="btn" type="submit">Send message</button>
                <p class="ok" role="status"></p>
            </form>
        </section>
    </main>
    <br><br><br>

    <!-- Footer Section -->
    <footer>
        <div class="wrap">© 2026 Apex Solutions. Websites, apps and brands for growing businesses.</div>
    </footer>
    <button class="sm-btn" id="top" aria-label="Scroll to top">↑</button>
    <script src="js/main.js"></script>
</body>

</html>
